const CONFIG={

  SUPABASE_ANON_KEY:"",   // Supabase の anon public キー

// ================= オンラインランキング =================
const RANK_ON=!!(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function sbFetch(path,opt={}){return fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/"+path,{...opt,headers:{apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:"Bearer "+CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json",...(opt.headers||{})}})}
async function fetchRanking(limit=50){const r=await sbFetch(`pinpon_scores?select=name,time,wrong,floor,created_at&order=time.asc&limit=${limit}`);if(!r.ok)throw new Error(r.status);return r.json()}
async function rankOf(t){const r=await sbFetch(`pinpon_scores?select=id&time=lt.${t}`,{method:"HEAD",headers:{Prefer:"count=exact"}});const c=r.headers.get("content-range");return c?parseInt(c.split("/")[1])+1:null}
async function submitScore(name,t,wrong,floor){const r=await sbFetch("pinpon_scores",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({name,time:Math.round(t*10)/10,wrong,floor})});if(!r.ok)throw new Error(r.status)}
function savedName(){try{return localStorage.getItem("pinpon_name")||""}catch(e){return""}}
async function doSubmit(){
  const inp=$("nm"),btn=$("subBtn"),msg=$("subMsg"),name=inp.value.trim().slice(0,12);
  if(!name){msg.textContent="名前を入れてね";return}
  try{localStorage.setItem("pinpon_name",name)}catch(e){}
  btn.disabled=true;msg.textContent="登録中…";
  try{await submitScore(name,lastRun.t,lastRun.w,lastRun.f);const rk=await rankOf(Math.round(lastRun.t*10)/10).catch(()=>null);
    msg.innerHTML=rk?`🏆 世界ランキング <b>${rk}位</b> に登録した！`:"🏆 登録した！";btn.textContent="登録済み";lastShare+=rk?`（世界${rk}位）`:"";}
  catch(e){btn.disabled=false;msg.textContent="登録できなかった…通信を確認してもう一度";}
}

}

const R=a=>a[Math.floor(Math.random()*a.length)], RI=n=>Math.floor(Math.random()*n), RF=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=RI(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

let S=null;

// ================= 音 =================
let AC=null,muted=false;
function initAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function toggleSnd(){muted=!muted;$("snd").textContent=muted?"🔇":"🔊"}
function chime(vol,pan,far,notes=[[659.25,0],[523.25,0.42]]){
  if(!AC||muted||vol<0.005)return;const t=AC.currentTime+0.02;
  const out=AC.createGain();out.gain.value=vol;let node=out;
  if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=pan;out.connect(p);node=p}
  if(far){const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=700;node.connect(lp);lp.connect(AC.destination)}else node.connect(AC.destination);
  for(const[f,d]of notes){
    for(const[mul,amp,len]of[[1,1,1.2],[2.01,0.22,0.5],[3.0,0.08,0.3]]){
      const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f*mul;
      g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(amp,t+d+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d+len);
      o.connect(g);g.connect(out);o.start(t+d);o.stop(t+d+len+0.05)}}
}
function pinponAt(x,z,boost=1){const p=player.position,d=Math.hypot(x-p.x,z-p.z);chime((Math.max(0,1-d/24)*0.3+0.015)*boost,Math.max(-1,Math.min(1,(x-p.x)/7)),d>9)}
function buzz(){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type="sawtooth";o.frequency.value=110;g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.55)}
function noise(dur,freq,type,vol,delay=0){if(!AC||muted)return;const t=AC.currentTime+0.01+delay,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const src=AC.createBufferSource();src.buffer=buf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t)}
function gacha(){noise(0.04,2600,"bandpass",0.9);noise(0.06,1300,"bandpass",0.7,0.09);noise(0.3,420,"lowpass",0.3,0.14)}
function batan(){noise(0.35,160,"lowpass",1.2);noise(0.05,1600,"bandpass",0.35,0.01)}
function fanfare(){chime(0.3,0,false,[[523.25,0],[659.25,0.15],[783.99,0.3],[1046.5,0.45]])}

// ================= Three 基本 =================
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x221e28);
scene.fog=new THREE.Fog(0x221e28,10,24);
const camera=new THREE.PerspectiveCamera(60,1,0.05,120);let baseFov=60;
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;baseFov=camera.aspect<0.8?74:58;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
const hemi=new THREE.HemisphereLight(0xfff6e6,0x6a6070,0.8);scene.add(hemi);
const moon=new THREE.DirectionalLight(0xc8d0ff,0.35);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);
Object.assign(moon.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:40});scene.add(moon,moon.target);
const lamp=new THREE.PointLight(0xffd9a0,1.15,11,1.4);scene.add(lamp);

function ctex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
const M=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,mat,x=0,y=0,z=0,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;if(parent)parent.add(m);return m}

// ---------- ボロい質感 ----------
function grime(g,w,h,n,col,rmax){for(let i=0;i<n;i++){const x=Math.random()*w,y=Math.random()*h,r=RF(2,rmax);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}}
function cracks(g,w,h,n){g.strokeStyle="rgba(40,30,20,.55)";g.lineWidth=1.2;for(let i=0;i<n;i++){let x=Math.random()*w,y=Math.random()*h;g.beginPath();g.moveTo(x,y);for(let k=0;k<6;k++){x+=RF(-14,14);y+=RF(4,16);g.lineTo(x,y)}g.stroke()}}
const wallTex=ctex(256,256,(g,w,h)=>{g.fillStyle="#e9e5dc";g.fillRect(0,0,w,h);
  grime(g,w,h,70,"rgba(90,80,60,.10)",14);
  for(let i=0;i<7;i++){const x=Math.random()*w,ww=RF(6,22);const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"rgba(120,100,60,.18)");gr.addColorStop(1,"rgba(90,70,40,0)");g.fillStyle=gr;g.fillRect(x,0,ww,RF(60,200))}
  for(let i=0;i<5;i++){const x=Math.random()*w,y=Math.random()*h;g.fillStyle="#f6f3ec";g.beginPath();g.ellipse(x,y,RF(5,12),RF(3,8),RF(0,3),0,7);g.fill();g.strokeStyle="rgba(60,50,30,.5)";g.stroke()}
  cracks(g,w,h,6);
  const b=g.createLinearGradient(0,h*0.72,0,h);b.addColorStop(0,"rgba(30,40,20,0)");b.addColorStop(1,"rgba(60,60,40,.25)");g.fillStyle=b;g.fillRect(0,0,w,h);
  g.fillStyle="#8a8070";g.fillRect(0,h-10,w,10)});
const floorTex=ctex(128,128,(g,w,h)=>{g.fillStyle="#dcd7cc";g.fillRect(0,0,w,h);g.fillStyle="#cdc7ba";g.fillRect(0,0,64,64);g.fillRect(64,64,64,64);
  g.strokeStyle="#a9a294";g.lineWidth=2;g.strokeRect(0,0,64,64);g.strokeRect(64,64,64,64);grime(g,w,h,14,"rgba(60,50,30,.15)",20);cracks(g,w,h,1)});
floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;
const wallMats=[M(0xffffff),M(0xffffff),M(0x5c564e),M(0x5c564e),M(0xffffff),M(0xffffff)];

function genFloor(f){
  const L=S.lover,here=f===L.floor,rooms=[];
  for(let i=0;i<ROOMS;i++){
    let a;
    if(here&&i===L.room)a=[...L.attrs];
    else if(Math.random()<(here?0.35:0.15)){a=[...L.attrs];const c=RI(3);a[c]=otherVal(a[c])}
    else do{a=[RI(8),RI(8),RI(8)]}while(a.every((v,k)=>v===L.attrs[k]));
    let look=makeLook();if(here&&i===L.room)while(!look.cute)look=makeLook();
    rooms.push({no:f*100+i+1,attrs:a,taken:false,knocked:false,mark:"",notes:[],noteCat:-1,look});
  }
  const NM=8,men=pickNames(NM).map(n=>({name:n,liar:false,talked:false,hint:null,glasses:Math.random()<0.7}));
  shuffle([...Array(NM).keys()]).slice(0,2).forEach(i=>{men[i].liar=true;men[i].glasses=false});
  const hints=[{type:"floor"},{type:"floor"},{type:"roomNot"},{type:"roomNot"}];
  while(hints.length<NM)hints.push({type:"flavor"});
  shuffle(hints).forEach((h,i)=>men[i].hint=h);
  return{rooms,men,knocks:5,events:0,rows:genLayout(f),faces:null,visited:false};
}

  if(d<0.18){n.path.shift();return}
  const sp=n.speed*(n.mode==="rival"?1.15:1)*(0.85+0.3*Math.sin(n.mesh.userData.phase*0.7));
  p.x+=dx/d*sp*dt;p.z+=dz/d*sp*dt;turnTo(n.mesh,dx,dz,dt,9);animWalk(n.mesh,sp,dt);
}

// ================= ループ =================
let camYaw=Math.PI,refYaw=Math.PI,movingPrev=false;const CAM_H=3.3,CAM_D=3.7;const clock=new THREE.Clock(),tmp=new THREE.Vector3(),mini=$("mini"),camT=new THREE.Vector3(),lookP=new THREE.Vector3();let lastSec=0,flickT=0;
function canStand(x,z){const r=0.28;return!isWall(x-r,z-r)&&!isWall(x+r,z-r)&&!isWall(x-r,z+r)&&!isWall(x+r,z+r)}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  if(S&&!S.over&&MAP){
    if(!S.paused){
      S.time-=dt;S.evT+=dt;S.knT-=dt;S.farT-=dt;
      if(Math.floor(S.time)!==lastSec){lastSec=Math.floor(S.time);updateHud()}
      if(S.time<=0)end("timeout");
      
      if(S.knT<=0){S.knT=RF(2,4.5);npcKnockEvent()}
      if(S.farT<=0){S.farT=RF(2.5,6);chime(RF(.02,.06),RF(-1,1),true)}
    }
    const busy=$("sheet").classList.contains("on")||S.paused;
    let ix=joy.x,iz=joy.y;
    if(keys.a||keys.arrowleft)ix=-1;if(keys.d||keys.arrowright)ix=1;if(keys.w||keys.arrowup)iz=-1;if(keys.s||keys.arrowdown)iz=1;
    const mag=Math.min(1,Math.hypot(ix,iz)),sp=busy?0:mag*5.4,P=player.position;
    const movingNow=sp>0;
    if(sp>0){
      // スティックはカメラ基準：上＝前進、左右＝その方向へ
      if(!movingPrev)refYaw=camYaw;
      const fx=Math.sin(refYaw),fz=Math.cos(refYaw),rx=-Math.cos(refYaw),rz=Math.sin(refYaw);
      const l=Math.hypot(ix,iz),wx=(fx*(-iz)+rx*ix)/l,wz=(fz*(-iz)+rz*ix)/l;
      const ox=P.x,oz=P.z,vx=wx*sp*dt,vz=wz*sp*dt;if(canStand(P.x+vx,P.z))P.x+=vx;if(canStand(P.x,P.z+vz))P.z+=vz;turnTo(player,wx,wz,dt,12);
      const mx=P.x-ox,mz=P.z-oz,ml=Math.hypot(mx,mz);
      if(ml>sp*dt*0.3&&(mx*Math.sin(camYaw)+mz*Math.cos(camYaw))/ml>-0.5){let d=Math.atan2(mx,mz)-camYaw;d=Math.atan2(Math.sin(d),Math.cos(d));camYaw+=d*Math.min(1,dt*3)}
    }
    movingPrev=movingNow;
    P.y=stairY(P.x,P.z);
    if(MAP.stairs&&!busy){
      if(P.z<MAP.stairs.z0-0.1&&!S.warned){S.warned=true;toast(`🪜 上り切ると${S.floor+1}階へ（エレベーターで戻れる）`)}
      if(P.z<MAP.stairs.z1+0.75)goUp();
    }
    animWalk(player,sp,dt);
    for(const n of[...npcs]){
      if(!busy||n.busy>0)updateNPC(n,dt);else animWalk(n.mesh,0,dt,true);
      tmp.subVectors(n.mesh.position,P);tmp.y=0;const d=tmp.length();
      if(d<0.6&&d>0.001){const nx=n.mesh.position.x+tmp.x/d*(0.6-d)*0.5,nz=n.mesh.position.z+tmp.z/d*(0.6-d)*0.5;if(canStand(nx,nz)){n.mesh.position.x=nx;n.mesh.position.z=nz}}
    }
    const nn=busy?null:findNear(),key=nn?nn.key:"";
    if(key!==(near?near.key:"")){near=nn;const a=$("act");if(nn){a.style.display="block";a.textContent=actLabel(nn)}else a.style.display="none"}
    else if(nn&&nn.type==="door")$("act").textContent=actLabel(nn);
    // 付箋の発見
    doors.forEach((d,i)=>{if(d.seen)return;const r=S.fl.rooms[i];if(Math.hypot(P.x-d.fx,P.z-d.fz)<2.2){d.seen=true;if(false){const t=attrNoteText(r).replace("\n"," ");r.notes.push(`📌 扉の付箋「${t}」`);drawPlate(i);toast(`📌 ${r.no}の扉に付箋「${t}」`)}}});
    // 壁の透過
    const cxp=camera.position.x,czp=camera.position.z,sgx=P.x-cxp,sgz=P.z-czp,sgl=sgx*sgx+sgz*sgz||1;
    for(const m of wallMeshes){const wx=m.position.x,wz=m.position.z;let t=((wx-cxp)*sgx+(wz-czp)*sgz)/sgl;t=Math.max(0,Math.min(1,t));const ddx=cxp+sgx*t-wx,ddz=czp+sgz*t-wz;const f=S.cine==null&&t<0.97&&ddx*ddx+ddz*ddz<1.5;const want=f?wallFade:wallMats;if(m.material!==want)m.material=want}
    if(++flickT%3===0){const g=mini.getContext("2d");drawMap(mini,Math.floor(Math.min(96/MAP.W,110/MAP.H)),false)}
  }
  if(MAP&&MAP.elev){const e=MAP.elev;e.open+=(e.target-e.open)*Math.min(1,dt*5);e.pl.position.x=-0.36-e.open*0.7;e.pr.position.x=0.36+e.open*0.7}
  for(const d of doors){d.open+=(d.target-d.open)*Math.min(1,dt*8);d.pivot.rotation.y=d.open*1.45;d.icon.visible=Math.hypot(camera.position.x-d.x,camera.position.z-d.z)>2.8}
  for(const l of lamps)if(l.userData.fl){l.material.color.setHex(Math.random()<0.08?0x3a3628:0xfff2c0)}
  lamp.intensity=Math.random()<0.015?0.4:1.15;
  for(const h of[...hearts]){h.position.y+=h.userData.v*dt;h.material.opacity-=dt*0.35;if(h.material.opacity<=0){scene.remove(h);hearts.splice(hearts.indexOf(h),1)}}
  if(S&&S.winW){const w=S.winW;tmp.subVectors(player.position,w.position);tmp.y=0;if(tmp.length()>0.9){w.position.addScaledVector(tmp.normalize(),dt*2.5);turnTo(w,tmp.x,tmp.z,dt);animWalk(w,2.5,dt)}else{animWalk(w,0,dt);turnTo(player,w.position.x-player.position.x,w.position.z-player.position.z,dt)}}
  const p=player.position;
  if(S&&S.cine!=null&&doors[S.cine]){
    const d=doors[S.cine],th=Math.atan2(d.dx,d.dz),sx=Math.cos(th),sz=-Math.sin(th),k=Math.min(1,dt*5);
    camT.set(d.x+d.dx*1.9+sx*0.25,1.75,d.z+d.dz*1.9+sz*0.25);lookP.lerp(new THREE.Vector3(d.x+d.dx*0.2+sx*0.12,1.15,d.z+d.dz*0.2+sz*0.12),k);
    camera.position.lerp(camT,k);camera.lookAt(lookP);
    lamp.position.set(d.x+d.dx*1.1,2.1,d.z+d.dz*1.1);
  }else{
    const k=Math.min(1,dt*8),fx=Math.sin(camYaw),fz=Math.cos(camYaw);
    camT.set(p.x-fx*CAM_D,CAM_H+p.y,p.z-fz*CAM_D);camera.position.lerp(camT,k);
    lookP.lerp(new THREE.Vector3(p.x+fx*3.2,1.1+p.y*0.9,p.z+fz*3.2),Math.min(1,dt*10));camera.lookAt(lookP);
    lamp.position.set(p.x,2.4,p.z+0.3);
  }
  {const tf=(S&&S.cine!=null)?(camera.aspect<0.8?92:70):baseFov;if(Math.abs(camera.fov-tf)>0.05){camera.fov+=(tf-camera.fov)*Math.min(1,dt*6);camera.updateProjectionMatrix()}}
  moon.position.set(p.x+5,14,p.z+4);moon.target.position.set(p.x,0,p.z);
  if(womanMesh&&womanMesh.userData.idle&&!(S&&S.winW))womanMesh.userData.body.position.y=Math.sin(performance.now()/380)*0.015;
  renderer.render(scene,camera);
  if(S&&!S.over)for(const n of npcs){if(S.cine!=null){n.label.style.display="none";continue}tmp.copy(n.mesh.position);tmp.y=2.45;const dist=tmp.distanceTo(p);tmp.project(camera);
    if(tmp.z>1||dist>9){n.label.style.display="none";continue}
    const want=(ringFresh(n)?"🔔":"")+(n.m.liar?"🕶️":"")+n.m.name;if(n.label.textContent!==want)n.label.textContent=want;
    n.label.style.display="block";n.label.style.left=(tmp.x*.5+.5)*innerWidth+"px";n.label.style.top=(-tmp.y*.5+.5)*innerHeight+"px"}
}

function titleScreen(){
  S=null;npcs.forEach(n=>{scene.remove(n.mesh);n.label.remove()});npcs=[];hideWoman();
  $("ui").style.display="none";const sc=$("screen");sc.style.display="flex";
  sc.innerHTML=`<h1>ピンポンマンション</h1><p class="note" style="color:#ddd">古びた8階建て・120部屋から、たった1人の恋人を探せ</p>
  <ul><li>画面を指でドラッグして歩く。男を<b>タップ</b>すると話せる。ドアの前で<b>🔔ピンポン</b>。</li>
  <li>女性はみんな「私があなたの恋人」と言う。本物は<b>呼び名・思い出・好きなもの</b>の3つが全部合う。</li>
  <li>1フロアで<b>ピンポンは5部屋まで</b>。通路の奥の階段を<b>歩いて上る</b>か、手前の<b>🛗エレベーター</b>で好きな階へ（遠いほど時間がかかる）。</li>
  <li>男たちの話は「多分」ばかり。🕶️サングラスの男はよく嘘をつく。</li><li>ただし<b>🔔ピンポンした直後の男</b>に聞けば、その部屋は<b>絶対違う</b>と確定できる。</li>
  <li>ピンポンするとドアが半開きになって女の子が顔を出す。人違いで抱きしめると−60秒。本物を帰したら終わり。</li>
  <li>恋人の階で5部屋使い切る／10分経過 → ゲームオーバー。<b>クリアタイムを競うRTA！</b></li></ul>${bestHtml()}
  <p class="note">🔊 音あり（iPhoneはマナーモードだと鳴りません）</p>
  <button class="b p" onclick="newGame()">ゲームスタート</button>${RANK_ON?`<button class="b g" onclick="rankingScreen()">🏆 世界ランキング</button>`:""}<div class="ad">広告枠</div>`;fillAds();
}
// タイトル背景用
S={fl:{rooms:Array.from({length:ROOMS},(_,i)=>({no:101+i,attrs:[0,0,0],taken:false,knocked:false,mark:"",notes:[],noteCat:-1}))}};
buildLevel(1);for(let i=0;i<ROOMS;i++)drawPlate(i);const[s0,r0]=MAP.start;player.position.set(tileX(s0),0,tileZ(r0));
titleScreen();loop();
</script>
